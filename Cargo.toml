[package]
name = "n-quads"
description = "RDF 1.1 N-Quads and gRDF parser with source code mapping"
version = "0.21.0"
edition = "2024"
rust-version = "1.96.0"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/n-quads/"
documentation = "https://docs.rs/n-quads"
keywords = ["rdf", "n-quads", "parser", "semantic-web", "w3c"]
categories = ["parser-implementations", "encoding", "web-programming"]
exclude = ["/.github"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
decoded-char = "0.1.1"
iri-rs = "3.3.2"
langtag = "1.1.0"
# Must track `rdfx`'s `locspan`: `Span` crosses the boundary between the two
# crates, so a mismatched major would be a distinct, incompatible type.
locspan = "1.0.0"
rdfx = { version = "0.24.0", features = ["meta"] }

[dev-dependencies]
log = "0.4.29"
stderrlog = "0.6.0"

[lints.clippy]
wildcard_dependencies = "warn"
wildcard_imports = "warn"
used_underscore_binding = "warn"
missing_const_for_fn = "warn"
cloned_instead_of_copied = "warn"
unnecessary_self_imports = "warn"
redundant_clone = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"
